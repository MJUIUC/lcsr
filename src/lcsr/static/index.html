<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lcsr — 18-week DSA curriculum</title>
<style>
:root{
  --bg:#f7f5f1; --panel:#fff; --panel2:#fbfaf8; --ink:#1b1b1d; --mid:#55555c;
  --muted:#86868f; --line:#e5e1d9; --line2:#efece5;
  --accent:#0f6b57; --accent-soft:#e6f0ec;
  --warn:#a15c12; --warn-soft:#fbf0e2; --danger:#b3261e; --ok:#1f7a45;
  --shadow:0 1px 2px rgba(20,20,20,.04),0 6px 20px rgba(20,20,20,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141416; --panel:#1c1c20; --panel2:#232329; --ink:#eeeef0; --mid:#b4b4bd;
  --muted:#82828c; --line:#2c2c33; --line2:#26262c;
  --accent:#59b79c; --accent-soft:#17322b;
  --warn:#d99a4e; --warn-soft:#33261480; --danger:#e8695f; --ok:#5cb47e;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.55 ui-sans-serif,-apple-system,"SF Pro Text",Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:ui-serif,Georgia,"Iowan Old Style",serif;font-weight:600;
  letter-spacing:-.012em;margin:0}
a{color:inherit}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ---------- shell ---------- */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(1.6) blur(12px);border-bottom:1px solid var(--line)}
.top .inner{max-width:1040px;margin:0 auto;padding:0 22px}
.brandrow{display:flex;align-items:center;gap:14px;padding:16px 0 12px}
.brand{font-family:ui-serif,Georgia,serif;font-size:19px;font-weight:600;letter-spacing:-.02em}
.brand em{font-style:normal;color:var(--accent)}
.daychip{font-size:12px;color:var(--mid);background:var(--panel);border:1px solid var(--line);
  padding:3px 10px;border-radius:99px;white-space:nowrap}
.spacer{flex:1}
.overall{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted)}
.obar{width:120px;height:5px;border-radius:99px;background:var(--line);overflow:hidden}
.obar i{display:block;height:100%;background:var(--accent);border-radius:99px}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{padding:9px 15px 12px;font-size:14px;color:var(--muted);white-space:nowrap;
  border-bottom:2px solid transparent;margin-bottom:-1px;transition:.13s}
nav button:hover{color:var(--ink)}
nav button[aria-current=true]{color:var(--ink);font-weight:550;border-bottom-color:var(--accent)}
nav .count{font-size:11px;color:var(--muted);background:var(--line2);border-radius:99px;
  padding:1px 6px;margin-left:6px}
nav button[aria-current=true] .count{background:var(--accent-soft);color:var(--accent)}
main{max-width:1040px;margin:0 auto;padding:26px 22px 90px}

/* ---------- generic ---------- */
.sec{margin:0 0 10px;display:flex;align-items:baseline;gap:10px}
.sec h2{font-size:15px}
.sec .hint{font-size:12.5px;color:var(--muted)}
.sec.due h2{color:var(--warn)}
.stack{display:flex;flex-direction:column;gap:7px;margin-bottom:30px}
.empty{color:var(--muted);font-size:14px;padding:44px 0;text-align:center;
  border:1px dashed var(--line);border-radius:12px}
.empty b{display:block;color:var(--ink);font-weight:550;margin-bottom:5px}

/* ---------- problem row ---------- */
.p{background:var(--panel);border:1px solid var(--line);border-radius:11px;
  box-shadow:var(--shadow);overflow:hidden;transition:.13s}
.p:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.p.due{border-left:3px solid var(--warn)}
.p.isdone{opacity:.62;box-shadow:none}
.p.isdone .ptitle a{text-decoration:line-through;text-decoration-color:var(--muted)}
.phead{display:flex;align-items:center;gap:11px;padding:11px 14px}
.dot{width:7px;height:7px;border-radius:99px;background:var(--line);flex:none}
.dot.done{background:var(--ok)} .dot.learning{background:var(--warn)}
.pid{font:500 12.5px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);
  min-width:42px;text-align:right;flex:none}
.ptitle{flex:1;min-width:0;font-size:14.5px}
.ptitle a{text-decoration:none;border-bottom:1px solid transparent}
.ptitle a:hover{color:var(--accent);border-bottom-color:currentColor}
.arrow{color:var(--muted);font-size:12px;flex:none}
.badge{font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;
  border-radius:99px;border:1px solid var(--line);color:var(--muted);flex:none;white-space:nowrap}
.badge.hard{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,transparent)}
.badge.late{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent);
  background:var(--warn-soft)}
.badge.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.pacts{display:flex;gap:6px;flex:none}
.btn{font-size:12.5px;padding:5px 12px;border-radius:7px;border:1px solid var(--line);
  color:var(--mid);transition:.13s}
.btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.btn.warn:hover{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{opacity:.88;color:#fff;background:var(--accent)}
.pcue{padding:0 14px 11px 74px;font-size:12.5px;color:var(--muted);font-style:italic;
  margin-top:-4px}
.pmeta{padding:0 14px 11px 74px;font-size:12.5px;color:var(--muted);margin-top:-4px}
.pmeta .ok{color:var(--ok)} .pmeta .w{color:var(--warn)}

/* ---------- log panel ---------- */
.panel{border-top:1px solid var(--line2);background:var(--panel2);padding:13px 14px}
.lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  margin-bottom:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:13px}
.chip{font-size:12.5px;padding:5px 12px;border-radius:99px;border:1px solid var(--line);
  color:var(--muted);transition:.13s}
.chip:hover{border-color:var(--warn);color:var(--warn)}
.chip[aria-pressed=true]{border-color:var(--warn);color:var(--warn);background:var(--warn-soft);
  font-weight:550}
textarea,input,select{font:inherit;font-size:13.5px;width:100%;padding:8px 11px;
  border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
textarea{resize:vertical;min-height:52px}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft)}
.prow{display:flex;gap:8px;margin-top:11px;align-items:center}

/* ---------- curriculum ---------- */
.grp{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  margin-bottom:9px;box-shadow:var(--shadow);overflow:hidden}
.grp[open]{border-color:color-mix(in srgb,var(--accent) 30%,var(--line))}
.grp summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;
  align-items:center;gap:13px}
.grp summary::-webkit-details-marker{display:none}
.grp summary:hover{background:var(--panel2)}
.wk{font:600 11px ui-monospace,Menlo,monospace;letter-spacing:.04em;color:var(--accent);
  background:var(--accent-soft);padding:4px 8px;border-radius:6px;flex:none;min-width:40px;
  text-align:center}
.gtitles{flex:1;min-width:0}
.gtitle{font-family:ui-serif,Georgia,serif;font-size:15.5px;font-weight:600;
  letter-spacing:-.01em}
.gsub{font-size:12.5px;color:var(--muted);margin-top:2px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.gprog{display:flex;align-items:center;gap:9px;flex:none}
.gprog span{font:500 12px ui-monospace,Menlo,monospace;color:var(--muted)}
.gbar{width:64px;height:5px;border-radius:99px;background:var(--line);overflow:hidden}
.gbar i{display:block;height:100%;background:var(--accent)}
.gbar.full i{background:var(--ok)}
.gbody{padding:4px 14px 15px;border-top:1px solid var(--line2)}
.rolelbl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  margin:15px 0 8px;font-weight:600}
.gbody .p{box-shadow:none;background:var(--panel2)}
.note{font-size:13.5px;color:var(--mid);padding:14px 2px;line-height:1.65}

/* ---------- history ---------- */
.day{margin-bottom:11px}
.dayhead{display:flex;align-items:baseline;gap:11px;margin:0 2px 8px}
.daydate{font-family:ui-serif,Georgia,serif;font-size:15px;font-weight:600}
.dayrel{font-size:12.5px;color:var(--muted)}
.daytally{margin-left:auto;font-size:12.5px;color:var(--muted)}
.h{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 14px;
  margin-bottom:6px;box-shadow:var(--shadow)}
.hhead{display:flex;align-items:center;gap:11px}
.hnote{margin-top:8px;padding:9px 12px;background:var(--panel2);border-radius:8px;
  font-size:13px;color:var(--mid);border-left:2px solid var(--line)}

/* ---------- cues ---------- */
.cue{background:var(--panel);border:1px solid var(--line);border-radius:11px;
  padding:13px 15px;margin-bottom:6px;box-shadow:var(--shadow);display:flex;
  align-items:center;gap:14px;cursor:pointer}
.cue:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.cuen{font:500 12px ui-monospace,Menlo,monospace;color:var(--muted);flex:none}
.cuel{flex:1;font-size:14.5px}
.cuer{flex:1;font-size:14px;color:var(--accent);font-weight:500}
.cuewhy{flex:1 1 100%;font-size:13px;color:var(--mid);line-height:1.6;
  border-top:1px solid var(--line2);padding-top:11px;margin-top:2px}
.cuer.hidden{color:var(--muted);font-weight:400;font-style:italic;opacity:.55}
@media(max-width:640px){
  .cue{flex-wrap:wrap} .cuel,.cuer{flex:1 1 100%}
  .pacts{width:100%;justify-content:flex-end} .pcue,.pmeta{padding-left:14px}
}

/* ---------- stats ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;
  margin-bottom:26px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:15px;
  box-shadow:var(--shadow)}
.card b{display:block;font-family:ui-serif,Georgia,serif;font-size:26px;font-weight:600;
  letter-spacing:-.02em;line-height:1.15}
.card span{font-size:11.5px;color:var(--muted);display:block;margin-top:4px}
.card small{font-size:11px;color:var(--muted)}
.hist{display:flex;align-items:flex-end;gap:8px;height:70px;margin-top:12px}
.hist div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.hist i{display:block;width:100%;background:var(--warn);border-radius:4px 4px 0 0;min-height:3px}
.hist small{font-size:10.5px;color:var(--muted);text-align:center}
details.add{margin-top:14px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:15px;box-shadow:var(--shadow)}
details.add summary{cursor:pointer;font-size:14px;font-weight:550;list-style:none}
details.add summary::-webkit-details-marker{display:none}
details.add summary::before{content:"+ ";color:var(--accent)}
details.add[open] summary::before{content:"− "}
.grid{display:grid;grid-template-columns:104px 1fr;gap:10px;margin-top:15px;align-items:center}
.grid label{font-size:12.5px;color:var(--muted)}
.err{color:var(--danger);font-size:13px;margin-top:10px}
.foot{margin-top:34px;font-size:12.5px;color:var(--muted);line-height:1.75}
.phead2{font-size:13px;color:var(--mid);margin-bottom:13px;padding-bottom:11px;
  border-bottom:1px solid var(--line)}
.phead2 b{color:var(--ink);font-weight:600}
.btn[aria-expanded=true]{border-color:var(--warn);color:var(--warn);background:var(--warn-soft);
  font-weight:550}
.stepper{display:flex;align-items:center;gap:9px;margin-bottom:18px}
.stepper .btn{min-width:34px;text-align:center}
.stepper .btn[disabled]{opacity:.35;cursor:default}
.stepper .btn[disabled]:hover{border-color:var(--line);color:var(--mid);background:none}
.stepdate{font-family:ui-serif,Georgia,serif;font-size:15px;font-weight:600}
.stepdate em{font-style:normal;font-weight:400;color:var(--muted);font-size:13px}
.preview{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);
  color:var(--warn);border-radius:10px;padding:11px 14px;font-size:13px;margin-bottom:20px}
.doneday{display:flex;align-items:center;gap:16px;background:var(--panel);
  border:1px solid color-mix(in srgb,var(--ok) 32%,var(--line));border-radius:12px;
  padding:20px 22px;box-shadow:var(--shadow)}
.doneday .tick{width:34px;height:34px;border-radius:99px;background:var(--accent-soft);
  color:var(--ok);display:grid;place-items:center;font-size:17px;flex:none}
.doneday b{display:block;font-family:ui-serif,Georgia,serif;font-size:16.5px;margin-bottom:3px}
.doneday span{display:block;font-size:13px;color:var(--mid)}
.doneday .quiet{font-size:12.5px;color:var(--muted);margin-top:5px;max-width:52ch}
.doneday button{margin-left:auto;flex:none}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:99px;font-size:13.5px;
  box-shadow:0 6px 24px rgba(0,0,0,.22);opacity:0;transition:.25s;pointer-events:none;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="top"><div class="inner">
  <div class="brandrow">
    <span class="brand">lc<em>sr</em></span>
    <span class="daychip" id="daychip">…</span>
    <span class="spacer"></span>
    <span class="overall" id="overall"></span>
  </div>
  <nav id="nav"></nav>
</div></div>

<main id="view"></main>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const TABS = [
  {k:'today',      label:'Today'},
  {k:'curriculum', label:'Curriculum'},
  {k:'history',    label:'History'},
  {k:'cues',       label:'Cue table'},
  {k:'stats',      label:'Stats'},
];
let tab = location.hash.slice(1) || 'today';
let plan=null, curric=null, hist=null, cues=null;
const draft = {};        // id -> {mistake, note}
const revealed = new Set();
let showAhead = false;
let preview = null;   // plan for a future day, null when viewing today

async function api(p, body){
  const r = await fetch(p, body ? {method:'POST',
    headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)} : {});
  const j = await r.json();
  if(!r.ok) throw new Error(j.error || 'request failed');
  return j;
}
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2400);
}
function relDay(iso){
  const d=new Date(iso+'T00:00:00'), now=new Date(); now.setHours(0,0,0,0);
  const n=Math.round((now-d)/864e5);
  return n===0?'today':n===1?'yesterday':n>0?`${n} days ago`:`in ${-n} days`;
}

/* ---------------- problem row ---------------- */
function pRow(p, o={}){
  const st = p.state || {};
  const late = o.late;
  const cls = ['p', st.status==='done'?'isdone':'', late!=null?'due':''].join(' ');
  const badges = [
    p.hard ? '<span class="badge hard">hard</span>' : '',
    late!=null ? `<span class="badge late">${late>0?late+'d late':'due today'}</span>` : '',
    o.showTier ? `<span class="badge">${esc(p.tier)}${p.week?' · W'+p.week:''}</span>` : '',
  ].join('');
  const acts = (o.readonly || (st.status==='done' && !o.alwaysAct)) ? '' : `
      <span class="pacts">
        <button class="btn" data-act="solved">Solved</button>
        <button class="btn warn" data-act="stuck" aria-expanded="false">Stuck</button>
        <button class="btn" data-act="note" title="add a note before logging">Note</button>
      </span>`;
  let meta = '';
  if(st.status==='done')      meta = `<div class="pmeta"><span class="ok">✓ solved</span> · ${st.attempts} attempt${st.attempts>1?'s':''}${st.last?' · last '+relDay(st.last):''}</div>`;
  else if(st.status==='learning' && st.due) meta = `<div class="pmeta"><span class="w">returns ${st.due}</span> · ${relDay(st.due)} · ${st.attempts} attempt${st.attempts>1?'s':''}</div>`;
  return `
  <div class="${cls}" data-id="${p.id}">
    <div class="phead">
      <span class="dot ${st.status||'new'}"></span>
      <span class="pid">${p.id}</span>
      ${p.immediately_after_prev?'<span class="arrow" title="solve immediately after the previous problem">↳</span>':''}
      <span class="ptitle"><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a></span>
      ${badges}${acts}
    </div>
    ${o.cue && p.cue ? `<div class="pcue">cue: ${esc(p.cue)}</div>` : ''}
    ${meta}
    <div class="panel" data-panel hidden>
      <div class="phead2">Logging <b>${p.id}</b> as <b>stuck</b> — it returns in 3 days,
        then 10, then 30. Failing again resets it to 3.</div>
      <div class="lbl">Note — the cue → the pattern</div>
      <textarea data-note placeholder="one line, in your own words"></textarea>
      <div class="lbl" style="margin-top:13px">Mistake class <span style="text-transform:none;letter-spacing:0">— only recorded when logged as stuck</span></div>
      <div class="chips">${(plan?.mistakes||[]).map(m=>
        `<button class="chip" data-mistake="${m}" aria-pressed="false">${m}</button>`).join('')}</div>
      <div class="prow">
        <button class="btn primary" data-act="solved">Log as solved</button>
        <button class="btn warn" data-act="confirm">Log as stuck</button>
        <button class="btn" data-act="cancel">Cancel</button>
      </div>
    </div>
  </div>`;
}

/* ---------------- views ---------------- */
function vToday(){
  const p = preview || plan;
  const ro = !p.is_today;
  let h = `<div class="stepper">
      <button class="btn" id="d-prev" ${ro?'':'disabled'}>‹</button>
      <span class="stepdate">${ro?'':'Today · '}${p.date}${
        ro?` <em>· ${relDay(p.date)}</em>`:''}</span>
      <button class="btn" id="d-next">›</button>
      ${ro?`<button class="btn" id="d-today">Back to today</button>`:''}
    </div>`;
  if(ro) h += `<div class="preview">Preview — you cannot log an attempt for another
    day. Due re-solves shown are everything outstanding by then.</div>`;

  if(p.due.length){
    h += `<div class="sec due"><h2>Due re-solves</h2><span class="hint">these come first</span></div>
          <div class="stack">${p.due.map(x=>pRow(x,{late:x.days_late,cue:true,showTier:true,readonly:ro})).join('')}</div>`;
  }
  for(const s of p.sections){
    h += `<div class="sec"><h2>${esc(s.title)}</h2></div>
          <div class="stack">${s.problems.map(x=>pRow(x,{cue:true,readonly:ro})).join('')}</div>`;
  }

  if(p.caught_up && !ro){
    const over = p.done_today > p.target_today;
    h += `<div class="doneday">
      <div class="tick">✓</div>
      <div>
        <b>Done for today</b>
        <span>${p.done_today} new problem${p.done_today===1?'':'s'}${
          p.resolves_today?` · ${p.resolves_today} re-solve${p.resolves_today===1?'':'s'}`:''
        } · today's target is ${p.target_today}${over?' — you went over':''}</span>
        <span class="quiet">The curriculum's load is deliberate. Working further ahead
          trades tomorrow's spacing for today's volume.</span>
      </div>
      ${p.ahead.length?`<button class="btn" id="ahead-toggle">Work ahead</button>`:''}
    </div>`;
    if(showAhead && p.ahead.length){
      h += `<div class="sec" style="margin-top:26px"><h2>Working ahead</h2>
              <span class="hint">counts toward tomorrow, not today</span></div>`;
      for(const s of p.ahead){
        h += `<div class="sec"><h2 style="font-size:13px;color:var(--muted)">${esc(s.title)}</h2></div>
              <div class="stack">${s.problems.map(x=>pRow(x,{cue:true,readonly:ro})).join('')}</div>`;
      }
    }
  }

  if(ro && !p.due.length && !p.sections.length)
    h += `<div class="empty"><b>Nothing scheduled</b>No re-solves fall due, and the
          curriculum has no new problems left to hand you that day.</div>`;
  return h;
}

function vCurriculum(){
  const cw = plan?.week || 1;
  return curric.groups.map(g=>{
    const pr=g.progress, pct=pr.total?Math.round(pr.done/pr.total*100):0;
    const isNow = g.week===cw;
    const wk = g.week ? 'W'+g.week : (g.key==='foundations'?'T0':g.key==='stretch'?'T3':
               g.key==='consolidation'?'W17':'+');
    const body = g.note
      ? `<div class="note">Adding new material here feels productive and measures nothing.
         These two weeks are the only part of the schedule where problems reach you
         <strong>without a pattern label attached</strong> — which is the only part that
         resembles an interview.</div>`
      : g.blocks.map(b=>
          `${b.title?`<div class="rolelbl">${esc(b.title)}</div>`:''}
           <div class="stack" style="margin-bottom:0;gap:6px">
             ${b.problems.map(x=>pRow(x,{})).join('')}</div>`).join('');
    return `<details class="grp" ${isNow?'open':''} data-key="${g.key}">
      <summary>
        <span class="wk">${wk}</span>
        <span class="gtitles">
          <span class="gtitle">${esc(g.title)}</span>
          <span class="gsub">${esc(g.subtitle||'')}</span>
        </span>
        <span class="gprog">
          ${pr.total?`<span>${pr.done}/${pr.total}</span>
          <span class="gbar ${pct===100?'full':''}"><i style="width:${pct}%"></i></span>`:''}
        </span>
      </summary>
      <div class="gbody">${body}</div>
    </details>`;
  }).join('');
}

function vHistory(){
  if(!hist.days.length) return `<div class="empty"><b>Nothing logged yet</b>Attempts appear here as you record them.</div>`;
  return hist.days.map(d=>`
    <div class="day">
      <div class="dayhead">
        <span class="daydate">${d.date}</span>
        <span class="dayrel">${relDay(d.date)}</span>
        <span class="daytally">${d.solved} solved${d.stuck?` · ${d.stuck} stuck`:''}</span>
      </div>
      ${d.entries.map(e=>`
        <div class="h">
          <div class="hhead">
            <span class="dot ${e.outcome==='solved'?'done':'learning'}"></span>
            <span class="pid">${e.id}</span>
            <span class="ptitle">${e.url?`<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title)}</a>`:esc(e.title)}</span>
            ${e.hard?'<span class="badge hard">hard</span>':''}
            <span class="badge">${esc(e.tier)}${e.week?' · W'+e.week:''}</span>
            <span class="badge ${e.outcome==='solved'?'ok':'late'}">${e.outcome}</span>
            ${e.mistake?`<span class="badge late">${esc(e.mistake)}</span>`:''}
          </div>
          ${e.note?`<div class="hnote">${esc(e.note)}</div>`:''}
        </div>`).join('')}
    </div>`).join('');
}

function vCues(){
  const groups = [];
  cues.forEach((c,i)=>{
    const g = groups.find(x=>x.name===c.group);
    (g || (groups[groups.push({name:c.group, rows:[]})-1])).rows.push({...c, i});
  });
  const n = cues.length;
  return `<div class="sec"><h2>Cue → pattern</h2>
    <span class="hint">the curriculum calls this the object of study — reconstruct it, don't read it</span></div>
    <div class="prow" style="margin:0 0 18px">
      <button class="btn" id="cue-all">Reveal all</button>
      <button class="btn" id="cue-none">Hide all</button>
      <span class="hint" style="margin-left:4px">${revealed.size}/${n} revealed</span>
    </div>` +
    groups.map(g=>`
      <div class="rolelbl" style="margin:22px 0 9px">${esc(g.name)}</div>` +
      g.rows.map(c=>{
        const open = revealed.has(c.i);
        return `<div class="cue" data-cue="${c.i}">
          <span class="cuen">${String(c.i+1).padStart(2,'0')}</span>
          <span class="cuel">${esc(c.says)}</span>
          <span class="cuer ${open?'':'hidden'}">${open?esc(c.reach_for):'tap to reveal'}</span>
          ${open && c.because ? `<span class="cuewhy">${esc(c.because)}</span>` : ''}
        </div>`;
      }).join('')).join('');
}

function vStats(){
  const m = plan.metrics;
  const rate = m.resolve_rate==null ? '—' : Math.round(m.resolve_rate*100)+'%';
  const rcol = m.resolve_rate==null ? 'var(--muted)' : (m.resolve_rate>.70?'var(--ok)':'var(--danger)');
  const mk = m.mistakes||{}, mx = Math.max(1,...Object.values(mk));
  return `
  <div class="cards">
    <div class="card"><b>${m.attempted}<small style="color:var(--muted)">/${m.total}</small></b>
      <span>attempted</span></div>
    <div class="card"><b style="color:${rcol}">${rate}</b>
      <span>cold re-solve · target &gt;70%</span></div>
    <div class="card"><b>${m.first_try??0}</b><span>solved cold, first try</span></div>
    <div class="card"><b>${m.approach_avg?m.approach_avg.toFixed(1)+'m':'—'}</b>
      <span>time to approach · target &lt;5m by W10</span></div>
  </div>
  <div class="sec"><h2>Mistake classes</h2>
    <span class="hint">after ~40 problems one class dominates — weeks 17–18 target that class</span></div>
  ${Object.keys(mk).length ? `<div class="card"><div class="hist">
    ${Object.entries(mk).map(([k,v])=>
      `<div><i style="height:${v/mx*52+3}px"></i><small>${esc(k)}<br>${v}</small></div>`).join('')}
  </div></div>` : `<div class="empty">No mistake classes logged yet. They are recorded when you mark a problem stuck.</div>`}
  <div class="foot" style="margin-top:20px">Problems-completed is deliberately not shown.
  The curriculum names it the easiest metric to watch and the weakest predictor of the three.</div>
  <details class="add">
    <summary>Add a problem</summary>
    <div class="grid">
      <label for="a-id">LeetCode #</label><input id="a-id" type="number" placeholder="1768">
      <label for="a-title">Title</label><input id="a-title" placeholder="Merge Strings Alternately">
      <label for="a-block">Block</label><input id="a-block" placeholder="Added">
      <label for="a-cue">Cue</label><input id="a-cue" placeholder="what the problem says…">
      <label for="a-week">Week</label><input id="a-week" type="number" placeholder="optional">
      <label for="a-hard">Hard</label><input id="a-hard" type="checkbox" style="width:auto">
    </div>
    <div class="prow"><button class="btn primary" id="a-save">Add problem</button></div>
    <div class="err" id="a-err"></div>
    <div class="foot">Saved to <code>~/.lcsr/custom.json</code>, separate from the packaged
      curriculum so upgrades never overwrite them. Reusing a packaged id overrides that problem.</div>
  </details>`;
}

/* ---------------- render ---------------- */
function renderChrome(){
  $('#daychip').innerHTML = `day ${plan.day} · week ${plan.week} · `
    + `<strong style="color:${plan.caught_up?'var(--ok)':'var(--ink)'}">`
    + `${plan.done_today}/${plan.target_today}</strong> today`;
  const o = curric?.overall;
  if(o) $('#overall').innerHTML =
    `<span class="obar"><i style="width:${o.done/o.total*100}%"></i></span>
     <span>${o.done} of ${o.total}</span>`;
  const dueN = plan.due.length + plan.sections.reduce((a,s)=>a+s.problems.length,0);
  $('#nav').innerHTML = TABS.map(t=>
    `<button data-tab="${t.k}" aria-current="${t.k===tab}">${t.label}${
      t.k==='today'&&dueN?`<span class="count">${dueN}</span>`:''}${
      t.k==='history'&&hist?`<span class="count">${hist.total}</span>`:''}</button>`).join('');
}
function render(){
  renderChrome();
  const v = {today:vToday, curriculum:vCurriculum, history:vHistory,
             cues:vCues, stats:vStats}[tab] || vToday;
  $('#view').innerHTML = v();
  window.scrollTo({top:0});
}

async function setDate(iso){
  if(iso === plan.date){ preview = null; return render(); }
  preview = await api('/api/plan?date=' + iso);
  showAhead = false;
  render();
}

async function go(t){
  tab = t; location.hash = t;
  if(t==='curriculum' && !curric) curric = await api('/api/curriculum');
  if(t==='history') hist = await api('/api/history');
  if(t==='cues' && !cues) cues = await api('/api/cues');
  render();
}

/* ---------------- events ---------------- */
$('#nav').addEventListener('click', e=>{
  const b=e.target.closest('[data-tab]'); if(b) go(b.dataset.tab);
});

document.addEventListener('click', async e=>{
  // cue reveal
  const cue = e.target.closest('[data-cue]');
  if(cue){ const i=+cue.dataset.cue; revealed.has(i)?revealed.delete(i):revealed.add(i); return render(); }
  if(e.target.id==='d-next' || e.target.id==='d-prev'){
    const cur = (preview || plan).date;
    const d = new Date(cur+'T00:00:00');
    d.setDate(d.getDate() + (e.target.id==='d-next' ? 1 : -1));
    return setDate(d.toISOString().slice(0,10));
  }
  if(e.target.id==='d-today'){ preview=null; return render(); }
  if(e.target.id==='ahead-toggle'){ showAhead = !showAhead; return render(); }
  if(e.target.id==='cue-all'){ cues.forEach((_,i)=>revealed.add(i)); return render(); }
  if(e.target.id==='cue-none'){ revealed.clear(); return render(); }

  const card = e.target.closest('.p'); if(!card) return;
  const id = +card.dataset.id, act = e.target.dataset.act;
  draft[id] = draft[id] || {};
  const panel = card.querySelector('[data-panel]');

  if(e.target.dataset.mistake){
    const m = e.target.dataset.mistake;
    draft[id].mistake = draft[id].mistake===m ? null : m;
    card.querySelectorAll('.chip').forEach(c=>
      c.setAttribute('aria-pressed', c.dataset.mistake===draft[id].mistake));
    return;
  }
  // 'stuck' and 'note' both just open the panel; nothing is written until a
  // Log button in it is pressed, so a mistyped note is never committed.
  if(act==='stuck' || act==='note'){
    panel.hidden = false;
    card.querySelector('[data-act=stuck]')?.setAttribute('aria-expanded','true');
    panel.scrollIntoView({block:'nearest', behavior:'smooth'});
    panel.querySelector('textarea').focus();
    return;
  }
  if(act==='cancel'){
    panel.hidden = true;
    card.querySelector('[data-act=stuck]')?.setAttribute('aria-expanded','false');
    delete draft[id]; return;
  }
  if(act==='solved' || act==='confirm'){
    const note = panel.querySelector('[data-note]').value.trim();
    try{
      await api('/api/log', {id, outcome: act==='solved'?'solved':'stuck',
                             mistake: draft[id].mistake, note});
      delete draft[id];
      toast(act==='solved' ? `${id} logged — does not return` : `${id} logged — returns in 3 days`);
      plan = await api('/api/plan');
      if(curric) curric = await api('/api/curriculum');
      if(hist)   hist   = await api('/api/history');
      render();
    }catch(err){ toast(err.message); }
  }
});

document.addEventListener('click', async e=>{
  if(e.target.id!=='a-save') return;
  $('#a-err').textContent='';
  try{
    await api('/api/add', {id:$('#a-id').value, title:$('#a-title').value,
      block:$('#a-block').value, cue:$('#a-cue').value,
      week:$('#a-week').value, hard:$('#a-hard').checked});
    curric = await api('/api/curriculum'); plan = await api('/api/plan');
    toast('problem added'); go('curriculum');
  }catch(err){ $('#a-err').textContent = err.message; }
});

window.addEventListener('hashchange', ()=>{ const t=location.hash.slice(1); if(t&&t!==tab) go(t); });

(async ()=>{
  plan = await api('/api/plan');
  curric = await api('/api/curriculum');
  if(tab==='history') hist = await api('/api/history');
  if(tab==='cues') cues = await api('/api/cues');
  render();
})();
</script>
</body>
</html>
