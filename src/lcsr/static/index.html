<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeetCode Spaced Repetition</title>
<meta name="description" content="Runs the daily loop from the 18-week DSA curriculum and
  records it: 322 problems, the cue table, and the +3d / +10d / +30d rule for problems you
  got stuck on.">
<meta name="color-scheme" content="light dark">
<meta property="og:title" content="LeetCode Spaced Repetition">
<meta property="og:description" content="Run the 18-week DSA curriculum's daily loop, and
  record it. No streaks, no problems-solved counter.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23ffa116'/><path d='M20.5 8.5 12 16l8.5 7.5' fill='none' stroke='%23151515' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<script>
(function(){try{var t=localStorage.getItem('lcsr-theme');
  if(t&&t!=='system')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<style>
/* LeetCode-flavoured. --brand is the LeetCode orange and is used for FILLS;
   --accent is the text-safe variant of it, because #ffa116 on white is ~2:1 and
   fails contrast for anything you have to read. Difficulty colours are
   LeetCode's own, so Easy/Medium/Hard mean the same here as on the site. */
:root{
  --brand:#ffa116;
  --bg:#f4f4f5; --panel:#fff; --panel2:#fafafa; --ink:#18181b; --mid:#4b4b52;
  --muted:#7c7c85; --line:#e3e3e6; --line2:#eeeef0;
  --accent:#a55a00; --accent-soft:#fdf1e0;
  --warn:#8a5a00; --warn-soft:#fdf3e2; --danger:#c62b3f; --ok:#00786a;
  --easy:#00876b; --medium:#8a5a00; --hard:#c62b3f;
  --pool:#6d38d6; --pool-soft:#f2ecfe;
  --shadow:0 1px 2px rgba(20,20,20,.05),0 6px 20px rgba(20,20,20,.05);
}
/* Pitch dark: a real #000, not a charcoal. Shadows do not read against black,
   so surfaces separate with borders instead and --shadow goes to none. */
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#000; --panel:#111; --panel2:#171717; --ink:#f2f2f2; --mid:#a6a6ad;
  --muted:#6f6f78; --line:#262626; --line2:#1d1d1d;
  --accent:#ffa116; --accent-soft:#2a1b06;
  --warn:#ffb800; --warn-soft:#241b04; --danger:#ff375f; --ok:#00b8a3;
  --easy:#00b8a3; --medium:#ffb800; --hard:#ff375f;
  --pool:#a78bfa; --pool-soft:#1c1233;
  --shadow:none;
}}
:root[data-theme=dark]{
  --bg:#000; --panel:#111; --panel2:#171717; --ink:#f2f2f2; --mid:#a6a6ad;
  --muted:#6f6f78; --line:#262626; --line2:#1d1d1d;
  --accent:#ffa116; --accent-soft:#2a1b06;
  --warn:#ffb800; --warn-soft:#241b04; --danger:#ff375f; --ok:#00b8a3;
  --easy:#00b8a3; --medium:#ffb800; --hard:#ff375f;
  --pool:#a78bfa; --pool-soft:#1c1233;
  --shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.55 ui-sans-serif,-apple-system,"SF Pro Text",Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:ui-serif,Georgia,"Iowan Old Style",serif;font-weight:600;
  letter-spacing:-.012em;margin:0}
a{color:inherit}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ---------- shell ---------- */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(1.6) blur(12px);border-bottom:1px solid var(--line)}
.top .inner{max-width:1040px;margin:0 auto;padding:0 22px}
.brandrow{display:flex;align-items:center;gap:13px;padding:16px 0 12px}
.brand{display:flex;align-items:baseline;gap:11px;text-decoration:none;min-width:0}
.mark{font-family:ui-serif,Georgia,serif;font-size:19px;font-weight:600;letter-spacing:-.02em;
  flex:none}
.mark em{font-style:normal;color:var(--brand)}
.full{font-family:ui-serif,Georgia,serif;font-size:14.5px;font-weight:600;letter-spacing:-.01em;
  color:var(--mid);padding-left:11px;border-left:1px solid var(--line);white-space:nowrap}
.theme{display:flex;gap:2px;background:var(--line2);border:1px solid var(--line);
  border-radius:8px;padding:2px;flex:none}
.theme button{font-size:11.5px;padding:4px 10px;border-radius:6px;color:var(--muted);
  transition:.13s}
.theme button:hover{color:var(--ink)}
.theme button[aria-pressed=true]{background:var(--panel);color:var(--ink);font-weight:550}
.sitefoot{border-top:1px solid var(--line);background:var(--panel);margin-top:70px}
.sitefoot .finner{max-width:1040px;margin:0 auto;padding:26px 22px 38px;display:flex;
  gap:14px 30px;flex-wrap:wrap;align-items:baseline}
.fname{font-family:ui-serif,Georgia,serif;font-size:15.5px;font-weight:600;letter-spacing:-.01em}
.fname em{font-style:normal;color:var(--brand)}
.fdesc{font-size:13px;color:var(--muted);line-height:1.7;flex:1;min-width:260px}
.fwhere{font-size:12px;color:var(--muted);line-height:1.7;flex-basis:100%;
  border-top:1px solid var(--line2);padding-top:14px}
@media(max-width:720px){.full{display:none} .overall{display:none}}
.daychip{font-size:12px;color:var(--mid);background:var(--panel);border:1px solid var(--line);
  padding:3px 10px;border-radius:99px;white-space:nowrap}
.spacer{flex:1}
.overall{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted)}
.obar{width:120px;height:5px;border-radius:99px;background:var(--line);overflow:hidden}
.obar i{display:block;height:100%;background:var(--brand);border-radius:99px}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{padding:9px 15px 12px;font-size:14px;color:var(--muted);white-space:nowrap;
  border-bottom:2px solid transparent;margin-bottom:-1px;transition:.13s}
nav button:hover{color:var(--ink)}
nav button[aria-current=true]{color:var(--ink);font-weight:550;border-bottom-color:var(--brand)}
nav .count{font-size:11px;color:var(--muted);background:var(--line2);border-radius:99px;
  padding:1px 6px;margin-left:6px}
nav button[aria-current=true] .count{background:var(--accent-soft);color:var(--accent)}
main{max-width:1040px;margin:0 auto;padding:26px 22px 40px;min-height:62vh}

/* ---------- generic ---------- */
.sec{margin:0 0 10px;display:flex;align-items:baseline;gap:10px}
.sec h2{font-size:15px}
.sec .hint{font-size:12.5px;color:var(--muted)}
.sec.due h2{color:var(--warn)}
.stack{display:flex;flex-direction:column;gap:7px;margin-bottom:30px}
.empty{color:var(--muted);font-size:14px;padding:44px 0;text-align:center;
  border:1px dashed var(--line);border-radius:12px}
.empty b{display:block;color:var(--ink);font-weight:550;margin-bottom:5px}

/* ---------- problem row ---------- */
.p{background:var(--panel);border:1px solid var(--line);border-radius:11px;
  box-shadow:var(--shadow);overflow:hidden;transition:.13s}
.p:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.p.due{border-left:3px solid var(--warn)}
.p.isdone{opacity:.62;box-shadow:none}
.p.isdone .ptitle a{text-decoration:line-through;text-decoration-color:var(--muted)}
.phead{display:flex;align-items:center;gap:11px;padding:11px 14px}
.dot{width:7px;height:7px;border-radius:99px;background:var(--line);flex:none}
.dot.done{background:var(--ok)} .dot.learning{background:var(--warn)}
.pid{font:500 12.5px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);
  min-width:42px;text-align:right;flex:none}
.ptitle{flex:1;min-width:0;font-size:14.5px}
.ptitle a{text-decoration:none;border-bottom:1px solid transparent}
.ptitle a:hover{color:var(--accent);border-bottom-color:currentColor}
.arrow{color:var(--muted);font-size:12px;flex:none}
.badge{font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;
  border-radius:99px;border:1px solid var(--line);color:var(--muted);flex:none;white-space:nowrap}
.badge.hard{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,transparent)}
.badge.late{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent);
  background:var(--warn-soft)}
.badge.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.pacts{display:flex;gap:6px;flex:none}
.btn{font-size:12.5px;padding:5px 12px;border-radius:7px;border:1px solid var(--line);
  color:var(--mid);transition:.13s}
.btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.btn.warn:hover{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#1a1200;font-weight:550}
.btn.primary:hover{opacity:.88;color:#1a1200;background:var(--brand)}
.pcue{padding:0 14px 11px 74px;font-size:12.5px;color:var(--muted);font-style:italic;
  margin-top:-4px}
.pmeta{padding:0 14px 11px 74px;font-size:12.5px;color:var(--muted);margin-top:-4px}
.pmeta .ok{color:var(--ok)} .pmeta .w{color:var(--warn)}

/* ---------- log panel ---------- */
.panel{border-top:1px solid var(--line2);background:var(--panel2);padding:13px 14px}
.lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  margin-bottom:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:13px}
.chip{font-size:12.5px;padding:5px 12px;border-radius:99px;border:1px solid var(--line);
  color:var(--muted);transition:.13s}
.chip:hover{border-color:var(--warn);color:var(--warn)}
.chip[aria-pressed=true]{border-color:var(--warn);color:var(--warn);background:var(--warn-soft);
  font-weight:550}
textarea,input,select{font:inherit;font-size:13.5px;width:100%;padding:8px 11px;
  border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
textarea{resize:vertical;min-height:52px}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft)}
.prow{display:flex;gap:8px;margin-top:11px;align-items:center}

/* ---------- curriculum ---------- */
.grp{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  margin-bottom:9px;box-shadow:var(--shadow);overflow:hidden}
.grp[open]{border-color:color-mix(in srgb,var(--accent) 30%,var(--line))}
.grp summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;
  align-items:center;gap:13px}
.grp summary::-webkit-details-marker{display:none}
.grp summary:hover{background:var(--panel2)}
.wk{font:600 11px ui-monospace,Menlo,monospace;letter-spacing:.04em;color:var(--accent);
  background:var(--accent-soft);padding:4px 8px;border-radius:6px;flex:none;min-width:40px;
  text-align:center}
.gtitles{flex:1;min-width:0}
.gtitle{font-family:ui-serif,Georgia,serif;font-size:15.5px;font-weight:600;
  letter-spacing:-.01em}
.gsub{font-size:12.5px;color:var(--muted);margin-top:2px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.gprog{display:flex;align-items:center;gap:9px;flex:none}
.gprog span{font:500 12px ui-monospace,Menlo,monospace;color:var(--muted)}
.gbar{width:64px;height:5px;border-radius:99px;background:var(--line);overflow:hidden}
.gbar i{display:block;height:100%;background:var(--brand)}
.gbar.full i{background:var(--ok)}
.gbody{padding:4px 14px 15px;border-top:1px solid var(--line2)}
.rolelbl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  margin:15px 0 8px;font-weight:600}
.gbody .p{box-shadow:none;background:var(--panel2)}
.note{font-size:13.5px;color:var(--mid);padding:14px 2px;line-height:1.65}

/* ---------- history ---------- */
.day{margin-bottom:11px}
.dayhead{display:flex;align-items:baseline;gap:11px;margin:0 2px 8px}
.daydate{font-family:ui-serif,Georgia,serif;font-size:15px;font-weight:600}
.dayrel{font-size:12.5px;color:var(--muted)}
.daytally{margin-left:auto;font-size:12.5px;color:var(--muted)}
.h{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 14px;
  margin-bottom:6px;box-shadow:var(--shadow)}
.hhead{display:flex;align-items:center;gap:11px}
.h .undo{margin-left:auto;flex:none;font-size:12px;padding:4px 10px}
.h .undo:hover{border-color:var(--danger);color:var(--danger);background:none}
.hnote{margin-top:8px;padding:9px 12px;background:var(--panel2);border-radius:8px;
  font-size:13px;color:var(--mid);border-left:2px solid var(--line)}

/* ---------- cues ---------- */
.cue{background:var(--panel);border:1px solid var(--line);border-radius:11px;
  padding:13px 15px;margin-bottom:6px;box-shadow:var(--shadow);display:flex;
  align-items:center;gap:14px;cursor:pointer}
.cue:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.cuen{font:500 12px ui-monospace,Menlo,monospace;color:var(--muted);flex:none}
.cuel{flex:1;font-size:14.5px}
.cuer{flex:1;font-size:14px;color:var(--accent);font-weight:500}
.cuewhy{flex:1 1 100%;font-size:13px;color:var(--mid);line-height:1.6;
  border-top:1px solid var(--line2);padding-top:11px;margin-top:2px}
.cuer.hidden{color:var(--muted);font-weight:400;font-style:italic;opacity:.55}
@media(max-width:640px){
  .cue{flex-wrap:wrap} .cuel,.cuer{flex:1 1 100%}
  .pacts{width:100%;justify-content:flex-end} .pcue,.pmeta{padding-left:14px}
}

/* ---------- stats ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;
  margin-bottom:26px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:15px;
  box-shadow:var(--shadow)}
.card b{display:block;font-family:ui-serif,Georgia,serif;font-size:26px;font-weight:600;
  letter-spacing:-.02em;line-height:1.15}
.card span{font-size:11.5px;color:var(--muted);display:block;margin-top:4px}
.card small{font-size:11px;color:var(--muted)}
.hist{display:flex;align-items:flex-end;gap:8px;height:70px;margin-top:12px}
.hist div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.hist i{display:block;width:100%;background:var(--warn);border-radius:4px 4px 0 0;min-height:3px}
.hist small{font-size:10.5px;color:var(--muted);text-align:center}
details.add{margin-top:14px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:15px;box-shadow:var(--shadow)}
details.add summary{cursor:pointer;font-size:14px;font-weight:550;list-style:none}
details.add summary::-webkit-details-marker{display:none}
details.add summary::before{content:"+ ";color:var(--accent)}
details.add[open] summary::before{content:"− "}
.grid{display:grid;grid-template-columns:104px 1fr;gap:10px;margin-top:15px;align-items:center}
.grid label{font-size:12.5px;color:var(--muted)}
.err{color:var(--danger);font-size:13px;margin-top:10px}
.foot{margin-top:34px;font-size:12.5px;color:var(--muted);line-height:1.75}
.drawacts{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap;border:none!important;
  box-shadow:none!important;background:none!important;border-radius:0!important}
.drawacts .panel{flex:1 1 100%;border-radius:10px;border:1px solid var(--line);margin-top:4px}
.drawbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.drawmeta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.drawtitle{font-family:ui-serif,Georgia,serif;font-size:23px;font-weight:600;
  letter-spacing:-.02em;display:flex;gap:11px;align-items:baseline;flex-wrap:wrap}
.drawtitle a{text-decoration:none;border-bottom:2px solid var(--accent-soft)}
.drawtitle a:hover{color:var(--accent);border-bottom-color:var(--accent)}
.drawtitle .pid{font-size:14px;min-width:auto}
.drawsub{font-size:13px;color:var(--muted);margin-top:6px}
.filters{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:15px;box-shadow:var(--shadow)}
.filters .chips{margin-bottom:14px}
.filters .chips:last-child{margin-bottom:0}
.badge.src{border-color:color-mix(in srgb,var(--accent) 30%,transparent);color:var(--accent)}
.badge.dEasy{color:var(--easy);border-color:color-mix(in srgb,var(--easy) 38%,transparent)}
.badge.dMedium{color:var(--medium);border-color:color-mix(in srgb,var(--medium) 38%,transparent)}
.badge.dHard{color:var(--hard);border-color:color-mix(in srgb,var(--hard) 38%,transparent)}
.badge.n4{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.badge.n3{border-color:var(--accent);color:var(--accent)}
/* Everything inside .pool swaps the LeetCode orange for the pool's violet. The
   components are unchanged; only the two accent tokens are. The point is that
   this tab must not read as more curriculum, which was the main reason it failed
   to explain itself. */
.pool{--accent:var(--pool);--accent-soft:var(--pool-soft);--brand:var(--pool)}
.pool .btn.primary{color:#fff}
.pool .btn.primary:hover{color:#fff}
.poolintro{background:var(--panel);border:1px solid var(--line);
  border-left:3px solid var(--pool);border-radius:12px;padding:20px 22px;
  margin-bottom:14px;box-shadow:var(--shadow)}
.poolintro h2{font-size:19px;margin-bottom:10px}
.poolintro p{margin:0 0 9px;font-size:13.5px;color:var(--mid);line-height:1.68;max-width:76ch}
.poolintro p:last-of-type{margin-bottom:0}
.poolintro b{color:var(--ink);font-weight:600}
.poolintro .apart{color:var(--pool)}
.srcs{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px;padding-top:14px;
  border-top:1px solid var(--line2)}
.srcpill{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--mid);
  background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:4px 11px}
.srcpill i{width:7px;height:7px;border-radius:99px;background:var(--pool);flex:none}
.srcpill b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.drawlead{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
  margin-bottom:11px;font-weight:600}
.psec{font-size:12px;color:var(--muted);margin-top:9px;line-height:1.7}
.psec b{color:var(--mid);font-weight:550}
.phead2{font-size:13px;color:var(--mid);margin-bottom:13px;padding-bottom:11px;
  border-bottom:1px solid var(--line)}
.phead2 b{color:var(--ink);font-weight:600}
.btn[aria-expanded=true]{border-color:var(--warn);color:var(--warn);background:var(--warn-soft);
  font-weight:550}
.pacebar{display:flex;gap:26px;flex-wrap:wrap;padding:12px 15px;margin-bottom:18px;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  box-shadow:var(--shadow);font-size:13px;color:var(--mid)}
.pacebar b{color:var(--ink);font-weight:600}
.pacebar em{font-style:normal;color:var(--muted);font-size:12px}
.drift{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 28%,transparent);
  color:var(--warn);border-radius:10px;padding:11px 14px;font-size:13px;margin-bottom:14px}
.drift b{color:inherit}
.paused{background:var(--panel);border:1px solid var(--danger);border-radius:12px;
  padding:17px 19px;margin-bottom:18px;box-shadow:var(--shadow)}
.paused b{display:block;font-family:ui-serif,Georgia,serif;font-size:16px;color:var(--danger);
  margin-bottom:6px}
.paused span{font-size:13px;color:var(--mid);line-height:1.6}
.morehint{font-size:12.5px;color:var(--muted);padding:4px 2px 0;margin-top:-20px;
  margin-bottom:26px}
.stepper{display:flex;align-items:center;gap:9px;margin-bottom:18px}
.stepper .btn{min-width:34px;text-align:center}
.stepper .btn[disabled]{opacity:.35;cursor:default}
.stepper .btn[disabled]:hover{border-color:var(--line);color:var(--mid);background:none}
.stepdate{font-family:ui-serif,Georgia,serif;font-size:15px;font-weight:600}
.stepdate em{font-style:normal;font-weight:400;color:var(--muted);font-size:13px}
.preview{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);
  color:var(--warn);border-radius:10px;padding:11px 14px;font-size:13px;margin-bottom:20px}
.doneday{display:flex;align-items:center;gap:16px;background:var(--panel);
  border:1px solid color-mix(in srgb,var(--ok) 32%,var(--line));border-radius:12px;
  padding:20px 22px;box-shadow:var(--shadow)}
.doneday .tick{width:34px;height:34px;border-radius:99px;background:var(--accent-soft);
  color:var(--ok);display:grid;place-items:center;font-size:17px;flex:none}
.doneday b{display:block;font-family:ui-serif,Georgia,serif;font-size:16.5px;margin-bottom:3px}
.doneday span{display:block;font-size:13px;color:var(--mid)}

  background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:99px;font-size:13.5px;
  box-shadow:0 6px 24px rgba(0,0,0,.22);opacity:0;transition:.25s;pointer-events:none;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="top"><div class="inner">
  <div class="brandrow">
    <a class="brand" href="#today">
      <span class="mark">lc<em>sr</em></span>
      <span class="full">LeetCode Spaced Repetition</span>
    </a>
    <span class="daychip" id="daychip">…</span>
    <span class="spacer"></span>
    <span class="overall" id="overall"></span>
    <div class="theme" id="theme" role="group" aria-label="Colour theme">
      <button data-theme-set="system">Auto</button>
      <button data-theme-set="light">Light</button>
      <button data-theme-set="dark">Dark</button>
    </div>
  </div>
  <nav id="nav" role="tablist" aria-label="Sections"></nav>
</div></div>

<main id="view"></main>

<footer class="sitefoot"><div class="finner">
  <span class="fname">LeetCode Spaced Repetition <em>(lcsr)</em></span>
  <span class="fdesc">Runs the daily loop from the 18-week DSA curriculum and records it.
    All 322 problems, the cue table, and the curriculum's +3d / +10d / +30d rule for
    problems you got stuck on. No streaks, and no problems-solved counter.</span>
  <span class="fwhere" id="footwhere"></span>
</div></footer>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const TABS = [
  {k:'today',      label:'Today'},
  {k:'curriculum', label:'Curriculum'},
  {k:'history',    label:'History'},
  {k:'pool',       label:'Interview pool'},
  {k:'cues',       label:'Cue table'},
  {k:'stats',      label:'Stats'},
];
let tab = location.hash.slice(1) || 'today';
if(tab === 'frequent') tab = 'pool';        // the tab this used to be called
let plan=null, curric=null, hist=null, cues=null, freq=null;
let drawn = null;
const FILT = {diff:new Set(), lists:new Set(), noPaid:false, noSolved:true, noCurric:true};
const draft = {};        // id -> {mistake, note}
const revealed = new Set();
let showAhead = false;
const inFlight = new Set();   // ids with a write in progress, so a double-click cannot double-log
let preview = null;   // plan for a future day, null when viewing today

async function api(p, body){
  const r = await fetch(p, body ? {method:'POST',
    headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)} : {});
  const j = await r.json();
  if(!r.ok) throw new Error(j.error || 'request failed');
  return j;
}
/* Three-way theme. prefers-color-scheme alone was not enough: someone whose OS
   sits in light mode could never reach the dark palette at all. 'system' removes
   the attribute so the media query takes over again. */
function currentTheme(){
  try{ return localStorage.getItem('lcsr-theme') || 'system'; }catch(e){ return 'system'; }
}
function paintThemeSwitch(){
  const cur = currentTheme();
  document.querySelectorAll('[data-theme-set]').forEach(b=>
    b.setAttribute('aria-pressed', b.dataset.themeSet === cur));
}
function setTheme(t){
  try{ localStorage.setItem('lcsr-theme', t); }catch(e){}
  if(t === 'system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  paintThemeSwitch();
}
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2400);
}
// Step a YYYY-MM-DD entirely in UTC. Parsing "2026-09-01T00:00:00" gives LOCAL
// midnight, and toISOString() then converts to UTC -- which in any zone at or
// east of Greenwich lands back on the PREVIOUS day, so "+1 day" returned the
// same date and the stepper silently did nothing. Parse with the Z and use the
// setUTC* setters so the arithmetic never crosses a local/UTC boundary.
function addDays(iso, n){
  const d = new Date(iso + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0,10);
}

function relDay(iso){
  const d=new Date(iso+'T00:00:00'), now=new Date(); now.setHours(0,0,0,0);
  const n=Math.round((now-d)/864e5);
  return n===0?'today':n===1?'yesterday':n>0?`${n} days ago`:`in ${-n} days`;
}

/* ---------------- problem row ---------------- */
function logPanel(p, solved){
  const chips = `<div class="lbl" style="margin-top:13px">Mistake class <span style="text-transform:none;letter-spacing:0">(only recorded when logged as stuck)</span></div>
      <div class="chips">${(plan?.mistakes||[]).map(m=>
        `<button class="chip" data-mistake="${m}" aria-pressed="${(draft[p.id]||{}).mistake===m}">${m}</button>`).join('')}</div>`;
  const head = solved
    ? `<div class="phead2">This is logged as <b>solved</b>. Changing it rewrites that
        attempt in place, keeping its original date. It does not count as working
        the problem again today.</div>`
    : `<div class="phead2">Logging <b>${p.id}</b>. Stuck means it returns in 3 days,
        then 10, then 30. Failing again resets it to 3.</div>`;
  const foot = solved
    ? `<button class="btn warn" data-act="amend-stuck">Change to stuck</button>
       <button class="btn" data-act="amend-clear">Remove the attempt</button>
       <button class="btn" data-act="cancel">Cancel</button>`
    : `<button class="btn primary" data-act="solved">Log as solved</button>
       <button class="btn warn" data-act="confirm">Log as stuck</button>
       <button class="btn" data-act="cancel">Cancel</button>`;
  // Panel visibility lives in draft so it survives a re-render too: any refresh
  // replaces innerHTML wholesale, which previously closed the panel and threw
  // away whatever had been typed into it.
  return `<div class="panel" data-panel ${(draft[p.id]||{}).open ? '' : 'hidden'}>
      ${head}
      <div class="lbl">Note: the cue, then the pattern</div>
      <textarea data-note placeholder="one line, in your own words">${esc((draft[p.id]||{}).note||'')}</textarea>
      ${chips}
      <div class="prow">${foot}</div>
    </div>`;
}

function logActions(solved){
  if(solved) return `<span class="pacts">
      <button class="btn" data-act="change">Change</button>
    </span>`;
  return `<span class="pacts">
      <button class="btn" data-act="solved">Solved</button>
      <button class="btn warn" data-act="stuck" aria-expanded="false">Stuck</button>
      <button class="btn" data-act="note">Note</button>
    </span>`;
}

function pRow(p, o={}){
  const st = p.state || {};
  const late = o.late;
  const cls = ['p', st.status==='done'?'isdone':'', late!=null?'due':''].join(' ');
  const badges = [
    p.hard ? '<span class="badge hard">hard</span>' : '',
    late!=null ? `<span class="badge late">${late>0?late+'d late':'due today'}</span>` : '',
    o.showTier ? `<span class="badge">${esc(p.tier)}${p.week?' · W'+p.week:''}</span>` : '',
  ].join('');
  const acts = o.readonly ? '' : logActions(st.status === 'done');
  let meta = '';
  if(st.status==='done')      meta = `<div class="pmeta"><span class="ok">✓ solved</span> · ${st.attempts} attempt${st.attempts>1?'s':''}${st.last?' · last '+relDay(st.last):''}</div>`;
  else if(st.status==='learning' && st.due) meta = `<div class="pmeta"><span class="w">returns ${st.due}</span> · ${relDay(st.due)} · ${st.attempts} attempt${st.attempts>1?'s':''}</div>`;
  return `
  <div class="${cls}" data-id="${p.id}">
    <div class="phead">
      <span class="dot ${st.status||'new'}"></span>
      <span class="pid">${p.id}</span>
      ${p.immediately_after_prev?'<span class="arrow" title="solve immediately after the previous problem">↳</span>':''}
      <span class="ptitle"><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a></span>
      ${badges}${acts}
    </div>
    ${o.cue && p.cue ? `<div class="pcue">cue: ${esc(p.cue)}</div>` : ''}
    ${meta}
    ${o.readonly ? '' : logPanel(p, st.status === 'done')}
  </div>`;
}

/* ---------------- views ---------------- */
function vToday(){
  const p = preview || plan;
  const ro = !p.is_today;
  let h = `<div class="stepper">
      <button class="btn" id="d-prev" ${ro?'':'disabled'}>‹</button>
      <span class="stepdate">${ro?'':'Today · '}${p.date}${
        ro?` <em>· ${relDay(p.date)}</em>`:''}</span>
      <button class="btn" id="d-next">›</button>
      ${ro?`<button class="btn" id="d-today">Back to today</button>`:''}
    </div>`;
  if(ro) h += `<div class="preview">Preview. You cannot log an attempt for another
    day. Due re-solves shown are everything outstanding by then.</div>`;

  if(!ro && p.idle_days >= 3)
    h += `<div class="drift">Nothing logged for <b>${p.idle_days} days</b>. Re-solves keep
      falling due while you are away, so the backlog is what grows. The new-problem
      queue just waits.</div>`;

  if(!ro && p.pace.started)
    h += `<div class="pacebar">
      <span><b>${p.pace.per_day.toFixed(1)}</b> problems/day <em>over ${p.pace.window_days} day${p.pace.window_days>1?'s':''}</em></span>
      <span><b>${p.projection.remaining}</b> left <em>of the required tiers</em></span>
      ${p.projection.finish ? `<span>on track to finish <b>${p.projection.finish}</b>
        <em>${Math.round(p.projection.days_left/7)} weeks</em></span>` : ''}
    </div>`;

  if(p.paused)
    h += `<div class="paused">
      <b>${p.backlog} re-solves outstanding, so new problems are paused</b>
      <span>The curriculum's rule when the cold re-solve rate slips is that you are moving
      too fast. Stacking new material on an unworked backlog is what makes that number
      worse, so nothing new is issued until the backlog is under ${p.pause_at}.</span></div>`;

  if(p.due.length){
    h += `<div class="sec due"><h2>Due re-solves</h2><span class="hint">${
      p.backlog > p.due.length
        ? `showing the ${p.due.length} most overdue of ${p.backlog}`
        : 'these come first'}</span></div>
          <div class="stack">${p.due.map(x=>pRow(x,{late:x.days_late,cue:true,showTier:true,readonly:ro})).join('')}</div>`;
    if(p.due_hidden)
      h += `<div class="morehint">+ ${p.due_hidden} more overdue, held back so the day stays
        finishable. They surface as these clear.</div>`;
  }
  for(const s of p.sections){
    h += `<div class="sec"><h2>${esc(s.title)}</h2></div>
          <div class="stack">${s.problems.map(x=>pRow(x,{cue:true,readonly:ro})).join('')}</div>`;
  }

  if(p.caught_up && !ro){
    const over = p.done_today > p.target_today;
    h += `<div class="doneday">
      <div class="tick">✓</div>
      <div>
        <b>Done for today</b>
        <span>${p.done_today} new problem${p.done_today===1?'':'s'}${
          p.resolves_today?` · ${p.resolves_today} re-solve${p.resolves_today===1?'':'s'}`:''
        } · today's target is ${p.target_today}${over?' (you went over)':''}</span>
        <span class="quiet">The curriculum's load is deliberate. Working further ahead
          trades tomorrow's spacing for today's volume.</span>
      </div>
      ${p.ahead.length?`<button class="btn" id="ahead-toggle">Work ahead</button>`:''}
    </div>`;
    if(showAhead && p.ahead.length){
      h += `<div class="sec" style="margin-top:26px"><h2>Working ahead</h2>
              <span class="hint">counts toward tomorrow, not today</span></div>`;
      for(const s of p.ahead){
        h += `<div class="sec"><h2 style="font-size:13px;color:var(--muted)">${esc(s.title)}</h2></div>
              <div class="stack">${s.problems.map(x=>pRow(x,{cue:true,readonly:ro})).join('')}</div>`;
      }
    }
  }

  if(ro && !p.due.length && !p.sections.length)
    h += `<div class="empty"><b>Nothing scheduled</b>No re-solves fall due, and the
          curriculum has no new problems left to hand you that day.</div>`;
  return h;
}

function vCurriculum(){
  const cw = plan?.week || 1;
  return curric.groups.map(g=>{
    const pr=g.progress, pct=pr.total?Math.round(pr.done/pr.total*100):0;
    const isNow = g.week===cw;
    const wk = g.week ? 'W'+g.week : (g.key==='foundations'?'T0':g.key==='stretch'?'T3':
               g.key==='consolidation'?'W17':'+');
    const body = g.note
      ? `<div class="note">Adding new material here feels productive and measures nothing.
         These two weeks are the only part of the schedule where problems reach you
         <strong>without a pattern label attached</strong>, which is the only part that
         resembles an interview.</div>`
      : g.blocks.map(b=>
          `${b.title?`<div class="rolelbl">${esc(b.title)}</div>`:''}
           <div class="stack" style="margin-bottom:0;gap:6px">
             ${b.problems.map(x=>pRow(x,{})).join('')}</div>`).join('');
    return `<details class="grp" ${isNow?'open':''} data-key="${g.key}">
      <summary>
        <span class="wk">${wk}</span>
        <span class="gtitles">
          <span class="gtitle">${esc(g.title)}</span>
          <span class="gsub">${esc(g.subtitle||'')}</span>
        </span>
        <span class="gprog">
          ${pr.total?`<span>${pr.done}/${pr.total}</span>
          <span class="gbar ${pct===100?'full':''}"><i style="width:${pct}%"></i></span>`:''}
        </span>
      </summary>
      <div class="gbody">${body}</div>
    </details>`;
  }).join('');
}

function vHistory(){
  if(!hist.days.length) return `<div class="empty"><b>Nothing logged yet</b>Attempts appear here as you record them.</div>`;
  return hist.days.map(d=>`
    <div class="day">
      <div class="dayhead">
        <span class="daydate">${d.date}</span>
        <span class="dayrel">${relDay(d.date)}</span>
        <span class="daytally">${d.solved} solved${d.stuck?` · ${d.stuck} stuck`:''}</span>
      </div>
      ${d.entries.map(e=>`
        <div class="h">
          <div class="hhead">
            <span class="dot ${e.outcome==='solved'?'done':'learning'}"></span>
            <span class="pid">${e.id}</span>
            <span class="ptitle">${e.url?`<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title)}</a>`:esc(e.title)}</span>
            ${e.hard?'<span class="badge hard">hard</span>':''}
            <span class="badge">${esc(e.tier)}${e.week?' · W'+e.week:''}</span>
            <span class="badge ${e.outcome==='solved'?'ok':'late'}">${e.outcome}</span>
            ${e.mistake?`<span class="badge late">${esc(e.mistake)}</span>`:''}
            ${e.can_undo?`<button class="btn undo" data-undo="${e.id}">Undo</button>`:''}
          </div>
          ${e.note?`<div class="hnote">${esc(e.note)}</div>`:''}
        </div>`).join('')}
    </div>`).join('');
}

function vCues(){
  const groups = [];
  cues.forEach((c,i)=>{
    const g = groups.find(x=>x.name===c.group);
    (g || (groups[groups.push({name:c.group, rows:[]})-1])).rows.push({...c, i});
  });
  const n = cues.length;
  return `<div class="sec"><h2>Cue → pattern</h2>
    <span class="hint">the curriculum calls this the object of study: reconstruct it, don't read it</span></div>
    <div class="prow" style="margin:0 0 18px">
      <button class="btn" id="cue-all">Reveal all</button>
      <button class="btn" id="cue-none">Hide all</button>
      <span class="hint" style="margin-left:4px">${revealed.size}/${n} revealed</span>
    </div>` +
    groups.map(g=>`
      <div class="rolelbl" style="margin:22px 0 9px">${esc(g.name)}</div>` +
      g.rows.map(c=>{
        const open = revealed.has(c.i);
        return `<div class="cue" data-cue="${c.i}">
          <span class="cuen">${String(c.i+1).padStart(2,'0')}</span>
          <span class="cuel">${esc(c.says)}</span>
          <span class="cuer ${open?'':'hidden'}">${open?esc(c.reach_for):'tap to reveal'}</span>
          ${open && c.because ? `<span class="cuewhy">${esc(c.because)}</span>` : ''}
        </div>`;
      }).join('')).join('');
}

function freqPool(){
  return freq.problems.filter(p=>{
    if(FILT.noPaid && p.paid) return false;
    if(FILT.noSolved && p.solved) return false;
    if(FILT.noCurric && p.in_curriculum) return false;
    if(FILT.diff.size && !FILT.diff.has(p.difficulty)) return false;
    if(FILT.lists.size && !p.lists.some(l=>FILT.lists.has(l))) return false;
    return true;
  });
}

function draw(){
  const pool = freqPool();
  if(!pool.length){ drawn = null; return; }
  // Weighted by how many of the four lists a problem appears in: something on
  // all four is asked far more often than something on one, and a flat random
  // draw over 363 would bury the nine that matter most.
  const total = pool.reduce((a,p)=>a+p.count,0);
  let r = Math.random()*total;
  for(const p of pool){ r -= p.count; if(r<=0){ drawn = p; return; } }
  drawn = pool[pool.length-1];
}

function listBadges(p){
  return p.lists.map(l=>`<span class="badge src ${l}">${esc(freq.labels[l])}</span>`).join('');
}

function freqRow(p){
  const c = p.curriculum;
  const meta = p.solved ? `<div class="pmeta"><span class="ok">✓ solved</span> · ${p.attempts} attempt${p.attempts>1?'s':''}</div>`
    : p.due ? `<div class="pmeta"><span class="w">returns ${p.due}</span> · ${relDay(p.due)}</div>` : '';
  return `<div class="p ${p.solved?'isdone':''}" data-id="${p.id}"><div class="phead">
    <span class="dot ${p.solved?'done':(p.attempted?'learning':'')}"></span>
    <span class="pid">${p.id}</span>
    <span class="ptitle"><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a></span>
    <span class="badge d${p.difficulty}">${esc(p.difficulty)}</span>
    ${p.paid?'<span class="badge hard">premium</span>':''}
    <span class="badge n${p.count}">${p.count===4?'on all 4 lists':p.count+' of 4 lists'}</span>
    ${c?`<span class="badge ok">curriculum${c.week?' W'+c.week:''}</span>`
       :'<span class="badge">not in curriculum</span>'}
    ${logActions(p.solved)}
  </div><div class="pcue">${listBadges(p)}</div>${meta}${logPanel(p, p.solved)}</div>`;
}

function vPool(){
  const st = freq.stats, pool = freqPool();
  const chip = (on,k,label) => `<button class="chip" aria-pressed="${on}" data-f="${k}">${label}</button>`;
  const d = drawn;
  const counts = {};
  for(const p of freq.problems) for(const l of p.lists) counts[l] = (counts[l]||0)+1;

  // Concept, then filters, then the draw. The old order put a lucky-dip button
  // first, so the first draw happened before you could see what you were
  // drawing from or that it was separate from the curriculum at all.
  const intro = `<div class="poolintro">
    <h2>Interview pool</h2>
    <p><b>${st.total} problems that interviews actually repeat</b>, merged from four public
      lists and deduplicated by LeetCode number. 599 raw entries collapse to ${st.total},
      because the lists overlap heavily and Striver's alone files 18 problems under two
      topics.</p>
    <p><b class="apart">This is separate from your 18-week curriculum.</b> Drawing here,
      and solving what you draw, never changes your curriculum progress, its totals, or any
      of the three metrics. The only crossing point is read-only:
      <b>${st.in_curriculum}</b> of these are already in your curriculum and
      <b>${st.only_here}</b> are not, and every row tells you which.</p>
    <div class="srcs">${Object.entries(freq.labels).map(([k,v])=>
      `<span class="srcpill"><i></i>${esc(v)} <b>${counts[k]||0}</b></span>`).join('')}</div>
  </div>`;

  const filters = `<div class="filters">
    <div class="lbl">Source list <span style="text-transform:none;letter-spacing:0">(any of those picked)</span></div>
    <div class="chips">${Object.entries(freq.labels).map(([k,v])=>
      chip(FILT.lists.has(k),'list:'+k,esc(v))).join('')}</div>
    <div class="lbl">Difficulty</div>
    <div class="chips">${['Easy','Medium','Hard'].map(x=>chip(FILT.diff.has(x),'diff:'+x,x)).join('')}</div>
    <div class="lbl">Leave out</div>
    <div class="chips">
      ${chip(FILT.noPaid,'x:noPaid','premium')}
      ${chip(FILT.noSolved,'x:noSolved','already solved')}
      ${chip(FILT.noCurric,'x:noCurric','already in curriculum')}
    </div>
  </div>`;

  const sections = d && d.sections
    ? `<div class="psec">${Object.entries(d.sections).map(([k,v])=>
        `<b>${esc(freq.labels[k])}:</b> ${esc(v)}`).join('<br>')}</div>` : '';

  const drawbox = `<div class="drawbox">
    <div class="drawlead">Lucky draw</div>
    ${d ? `
      <div class="drawmeta">${listBadges(d)}
        <span class="badge d${d.difficulty}">${esc(d.difficulty)}</span>
        <span class="badge n${d.count}">${d.count===4?'on all 4 lists':d.count+' of 4 lists'}</span>
        ${d.curriculum?`<span class="badge ok">in curriculum${d.curriculum.week?' · W'+d.curriculum.week:''}</span>`
                      :'<span class="badge">not in curriculum</span>'}</div>
      <div class="drawtitle"><span class="pid">${d.id}</span>
        <a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.title)}</a></div>
      ${d.curriculum?`<div class="drawsub">${esc(d.curriculum.block)}</div>`:''}
      ${sections}
      <div class="drawacts p" data-id="${d.id}">
        ${logActions(d.solved)}
        ${logPanel(d, d.solved)}
      </div>
    ` : `<div class="drawtitle" style="opacity:.6">${
          pool.length ? 'Press draw' : 'Nothing matches these filters'}</div>`}
    <div class="prow">
      <button class="btn primary" id="f-draw">${d?'Draw again':'Draw a problem'}</button>
      <span class="hint"><b>${pool.length}</b> in the pool, weighted by how many of the four
        lists a problem is on, so the ones every list agrees about come up most.</span>
    </div>
  </div>`;

  return `<div class="pool">
    ${intro}
    ${filters}
    <div style="height:14px"></div>
    ${drawbox}
    <div class="sec"><h2>All ${pool.length} in the pool</h2>
      <span class="hint">most-overlapping first</span></div>
    <div class="stack">${pool.map(freqRow).join('')}</div>
  </div>`;
}

function vStats(){
  const m = plan.metrics;
  const rate = m.resolve_rate==null ? 'not yet' : Math.round(m.resolve_rate*100)+'%';
  const rcol = m.resolve_rate==null ? 'var(--muted)' : (m.resolve_rate>.70?'var(--ok)':'var(--danger)');
  const mk = m.mistakes||{}, mx = Math.max(1,...Object.values(mk));
  return `
  <div class="cards">
    <div class="card"><b>${m.attempted}<small style="color:var(--muted)">/${m.total}</small></b>
      <span>attempted</span></div>
    <div class="card"><b style="color:${rcol}">${rate}</b>
      <span>cold re-solve · target &gt;70%</span></div>
    <div class="card"><b>${m.first_try??0}</b><span>solved cold, first try</span></div>
    <div class="card"><b>${m.approach_avg?m.approach_avg.toFixed(1)+'m':'not yet'}</b>
      <span>time to approach · target &lt;5m by W10</span></div>
  </div>
  <div class="sec"><h2>Mistake classes</h2>
    <span class="hint">after ~40 problems one class dominates, and weeks 17 to 18 target that class</span></div>
  ${Object.keys(mk).length ? `<div class="card"><div class="hist">
    ${Object.entries(mk).map(([k,v])=>
      `<div><i style="height:${v/mx*52+3}px"></i><small>${esc(k)}<br>${v}</small></div>`).join('')}
  </div></div>` : `<div class="empty">No mistake classes logged yet. They are recorded when you mark a problem stuck.</div>`}
  <div class="foot" style="margin-top:20px">Problems-completed is deliberately not shown.
  The curriculum names it the easiest metric to watch and the weakest predictor of the three.</div>
  <details class="add">
    <summary>Add a problem</summary>
    <div class="grid">
      <label for="a-id">LeetCode #</label><input id="a-id" type="number" placeholder="1768">
      <label for="a-title">Title</label><input id="a-title" placeholder="Merge Strings Alternately">
      <label for="a-block">Block</label><input id="a-block" placeholder="Added">
      <label for="a-cue">Cue</label><input id="a-cue" placeholder="what the problem says…">
      <label for="a-week">Week</label><input id="a-week" type="number" placeholder="optional">
      <label for="a-hard">Hard</label><input id="a-hard" type="checkbox" style="width:auto">
    </div>
    <div class="prow"><button class="btn primary" id="a-save">Add problem</button></div>
    <div class="err" id="a-err"></div>
    <div class="foot">Saved to <code>~/.lcsr/custom.json</code>, separate from the packaged
      curriculum so upgrades never overwrite them. Reusing a packaged id overrides that problem.</div>
  </details>`;
}

/* ---------------- render ---------------- */
function renderChrome(){
  $('#daychip').innerHTML = `day ${plan.day} · week ${plan.week}${
      plan.block ? ' · ' + esc(plan.block) : ''} · `
    + `<strong style="color:${plan.caught_up?'var(--ok)':'var(--ink)'}">`
    + `${plan.done_today}/${plan.target_today}</strong> today`;
  const o = curric?.overall;
  if(o) $('#overall').innerHTML =
    `<span class="obar"><i style="width:${o.done/o.total*100}%"></i></span>
     <span>${o.done} of ${o.total}</span>`;
  const dueN = plan.due.length + plan.sections.reduce((a,s)=>a+s.problems.length,0);
  $('#nav').innerHTML = TABS.map(t=>
    `<button data-tab="${t.k}" aria-current="${t.k===tab}">${t.label}${
      t.k==='today'&&dueN?`<span class="count">${dueN}</span>`:''}${
      t.k==='history'&&hist?`<span class="count">${hist.total}</span>`:''}</button>`).join('');
}
// Re-rendering replaces the whole view, so scroll position has to be restored
// deliberately. Only a tab change should jump to the top -- revealing a cue,
// toggling work-ahead or logging an attempt must leave you where you were.
function render(opts={}){
  const y = window.scrollY;
  renderChrome();
  const v = {today:vToday, curriculum:vCurriculum, history:vHistory,
             pool:vPool, cues:vCues, stats:vStats}[tab] || vToday;
  $('#view').innerHTML = v();
  window.scrollTo({top: opts.top ? 0 : y});
}

async function refreshAll(){
  plan = await api('/api/plan');
  if(curric) curric = await api('/api/curriculum');
  if(hist)   hist   = await api('/api/history');
  if(freq){ freq = await api('/api/frequent');
            if(drawn) drawn = freq.problems.find(x=>x.id===drawn.id) || drawn; }
  if(preview) preview = await api('/api/plan?date=' + preview.date);
  render();
}

async function setDate(iso){
  if(iso === plan.date){ preview = null; return render(); }
  preview = await api('/api/plan?date=' + iso);
  showAhead = false;
  render({top:true});
}

async function go(t){
  const prev = tab;
  tab = t; location.hash = t;
  try{
  if(t==='curriculum' && !curric) curric = await api('/api/curriculum');
  if(t==='history') hist = await api('/api/history');
  if(t==='pool' && !freq){ freq = await api('/api/frequent'); if(!drawn) draw(); }
    if(t==='cues' && !cues) cues = await api('/api/cues');
  }catch(err){
    tab = prev; location.hash = prev; toast(err.message); return;
  }
  render({top:true});
}

/* ---------------- events ---------------- */
document.addEventListener('input', e=>{
  const card = e.target.closest('.p');
  if(card && e.target.matches('[data-note]')){
    const id = +card.dataset.id;
    (draft[id] = draft[id] || {}).note = e.target.value;
  }
});

$('#nav').addEventListener('click', e=>{
  const b=e.target.closest('[data-tab]'); if(b) go(b.dataset.tab);
});
$('#theme').addEventListener('click', e=>{
  const b=e.target.closest('[data-theme-set]'); if(b) setTheme(b.dataset.themeSet);
});
paintThemeSwitch();
$('#footwhere').textContent =
  'Everything is recomputed from ~/.lcsr/log.jsonl, an append-only file on this '
  + 'machine. The page stores nothing of its own, so closing the tab loses nothing.';

document.addEventListener('click', async e=>{
  // cue reveal
  const cue = e.target.closest('[data-cue]');
  if(cue){ const i=+cue.dataset.cue; revealed.has(i)?revealed.delete(i):revealed.add(i); return render(); }
  if(e.target.id==='d-next' || e.target.id==='d-prev'){
    return setDate(addDays((preview || plan).date, e.target.id==='d-next' ? 1 : -1));
  }
  if(e.target.id==='d-today'){ preview=null; return render(); }
  if(e.target.id==='ahead-toggle'){ showAhead = !showAhead; return render(); }
  if(e.target.id==='f-draw'){ draw(); return render(); }
  if(e.target.dataset.f){
    const [kind,val] = e.target.dataset.f.split(':');
    if(kind==='diff') FILT.diff.has(val)?FILT.diff.delete(val):FILT.diff.add(val);
    if(kind==='list') FILT.lists.has(val)?FILT.lists.delete(val):FILT.lists.add(val);
    if(kind==='x')    FILT[val] = !FILT[val];
    if(drawn && !freqPool().some(p=>p.id===drawn.id)) drawn = null;
    return render();
  }
  if(e.target.id==='cue-all'){ cues.forEach((_,i)=>revealed.add(i)); return render(); }
  if(e.target.id==='cue-none'){ revealed.clear(); return render(); }

  if(e.target.dataset.undo){
    const id = +e.target.dataset.undo;
    try{
      const r = await api('/api/undo', {id});
      toast(`undid ${r.undone} on ${id}`);
      plan = await api('/api/plan');
      hist = await api('/api/history');
      if(curric) curric = await api('/api/curriculum');
      if(freq){ freq = await api('/api/frequent');
                if(drawn) drawn = freq.problems.find(x=>x.id===drawn.id) || drawn; }
      if(preview) preview = await api('/api/plan?date=' + preview.date);
      render();
    }catch(err){ toast(err.message); }
    return;
  }

  const card = e.target.closest('.p'); if(!card) return;
  const id = +card.dataset.id, act = e.target.dataset.act;
  draft[id] = draft[id] || {};
  const panel = card.querySelector('[data-panel]');

  if(e.target.dataset.mistake){
    const m = e.target.dataset.mistake;
    draft[id].mistake = draft[id].mistake===m ? null : m;
    card.querySelectorAll('.chip').forEach(c=>
      c.setAttribute('aria-pressed', c.dataset.mistake===draft[id].mistake));
    return;
  }
  // 'stuck' and 'note' both just open the panel; nothing is written until a
  // Log button in it is pressed, so a mistyped note is never committed.
  if(act==='change'){
    draft[id].open = true;
    panel.hidden = false;
    panel.scrollIntoView({block:'nearest', behavior:'smooth'});
    return;
  }
  if(act==='amend-stuck' || act==='amend-clear'){
    if(inFlight.has(id)) return;
    inFlight.add(id);
    const note = panel.querySelector('[data-note]').value.trim();
    try{
      if(act==='amend-clear'){
        const r = await api('/api/undo', {id});
        toast(`${id}: attempt removed`);
      }else{
        const r = await api('/api/amend', {id, outcome:'stuck',
                            mistake: draft[id].mistake, note});
        toast(`${id} is now stuck, returns ${r.due}`);
      }
      delete draft[id];
      await refreshAll();
    }catch(err){ toast(err.message); }
    finally{ inFlight.delete(id); }
    return;
  }
  if(act==='stuck' || act==='note'){
    draft[id].open = true;
    panel.hidden = false;
    card.querySelector('[data-act=stuck]')?.setAttribute('aria-expanded','true');
    panel.scrollIntoView({block:'nearest', behavior:'smooth'});
    panel.querySelector('textarea').focus();
    return;
  }
  if(act==='cancel'){
    panel.hidden = true;
    draft[id] = {};
    card.querySelector('[data-act=stuck]')?.setAttribute('aria-expanded','false');
    delete draft[id]; return;
  }
  if(act==='solved' || act==='confirm'){
    if(inFlight.has(id)) return;
    inFlight.add(id);
    const note = panel.querySelector('[data-note]').value.trim();
    try{
      await api('/api/log', {id, outcome: act==='solved'?'solved':'stuck',
                             mistake: draft[id].mistake, note});
      delete draft[id];
      toast(act==='solved' ? `${id} logged, does not return` : `${id} logged, returns in 3 days`);
      await refreshAll();
    }catch(err){ toast(err.message); }
    finally{ inFlight.delete(id); }
  }
});

document.addEventListener('click', async e=>{
  if(e.target.id!=='a-save') return;
  $('#a-err').textContent='';
  try{
    await api('/api/add', {id:$('#a-id').value, title:$('#a-title').value,
      block:$('#a-block').value, cue:$('#a-cue').value,
      week:$('#a-week').value, hard:$('#a-hard').checked});
    curric = await api('/api/curriculum'); plan = await api('/api/plan');
    toast('problem added'); go('curriculum');
  }catch(err){ $('#a-err').textContent = err.message; }
});

window.addEventListener('hashchange', ()=>{ const t=location.hash.slice(1); if(t&&t!==tab) go(t); });

(async ()=>{
  plan = await api('/api/plan');
  curric = await api('/api/curriculum');
  if(tab==='history')  hist = await api('/api/history');
  if(tab==='cues')     cues = await api('/api/cues');
  if(tab==='pool'){ freq = await api('/api/frequent'); if(!drawn) draw(); }
  render();
})().catch(err => {
  // Without this a failed bootstrap left #nav and #view empty -- a blank page
  // with no error and no way back to any other tab.
  document.getElementById('view').innerHTML =
    `<div class="empty"><b>Could not reach lcsr</b>${esc(err.message)}<br><br>
     Is <code>lcsr serve</code> still running?</div>`;
});
</script>
</body>
</html>
