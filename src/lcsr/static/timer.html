<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timed attempt</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<script>
(function(){try{var t=localStorage.getItem('lcsr-theme');
  if(t&&t!=='system')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<style>
:root{
  --brand:#ffa116;
  --bg:#f4f4f5; --panel:#fff; --ink:#18181b; --mid:#4b4b52;
  --muted:#6e6e77; --line:#e3e3e6;
  --accent:#a55a00; --accent-soft:#fdf1e0;
  --warn:#8a5a00; --danger:#c62b3f; --ok:#00786a;
  --shadow:0 1px 2px rgba(20,20,20,.05),0 6px 20px rgba(20,20,20,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#000; --panel:#111; --ink:#f2f2f2; --mid:#a6a6ad;
  --muted:#86868f; --line:#262626;
  --accent:#ffa116; --accent-soft:#2a1b06;
  --warn:#ffb800; --danger:#ff375f; --ok:#00b8a3;
  --shadow:none;
}}
:root[data-theme=dark]{
  --bg:#000; --panel:#111; --ink:#f2f2f2; --mid:#a6a6ad;
  --muted:#86868f; --line:#262626;
  --accent:#ffa116; --accent-soft:#2a1b06;
  --warn:#ffb800; --danger:#ff375f; --ok:#00b8a3;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 ui-sans-serif,-apple-system,"SF Pro Text",Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
.wrap{flex:1;display:flex;flex-direction:column;padding:20px;gap:14px}
.pid{font:500 12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}
.title{font-family:ui-serif,Georgia,"Iowan Old Style",serif;font-size:15px;font-weight:600;
  letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clock{flex:1;display:flex;align-items:center;justify-content:center}
.time{font:600 56px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums}
.time.warn{color:var(--warn)}
.time.danger{color:var(--danger)}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;flex:none}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;
  transition:width .25s linear,background .25s linear}
.bar i.warn{background:var(--warn)}
.bar i.danger{background:var(--danger)}
.row{display:flex;gap:8px;flex:none}
.btn{flex:1;font-size:13.5px;padding:11px 12px;border-radius:9px;border:1px solid var(--line);
  color:var(--mid);transition:.13s;text-align:center;background:var(--panel)}
.btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#1a1200;font-weight:600}
.btn.primary:hover{opacity:.88;color:#1a1200;background:var(--brand)}
.end{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;text-align:center}
.end b{font-family:ui-serif,Georgia,serif;font-size:20px;font-weight:600}
.end span{font-size:13px;color:var(--muted)}
.hint{font-size:11.5px;color:var(--muted);text-align:center}
.videos{flex:1;display:flex;flex-direction:column;overflow:hidden}
.vhead{padding:14px 16px 8px;flex:none}
.vhead b{font-family:ui-serif,Georgia,serif;font-size:16px;font-weight:600;display:block;
  color:var(--danger)}
.vhead span{font-size:12px;color:var(--muted);display:block;margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vlist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:1px}
.vitem{display:flex;gap:10px;padding:9px 14px;cursor:pointer;align-items:center;
  border-bottom:1px solid var(--line2,var(--line))}
.vitem:hover{background:var(--accent-soft)}
.vthumb{width:80px;height:45px;object-fit:cover;border-radius:4px;flex:none;background:var(--line)}
.vmeta{min-width:0}
.vtitle{font-size:12.5px;font-weight:500;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vchan{font-size:11px;color:var(--muted);margin-top:3px}
.vplayer{flex:1;display:flex;flex-direction:column}
.vplayer iframe{flex:1;width:100%;border:none}
</style>
</head>
<body>
<div class="wrap" id="live">
  <div>
    <div class="pid" id="pid"></div>
    <div class="title" id="ptitle"></div>
  </div>
  <div class="clock"><div class="time" id="time">--:--</div></div>
  <div class="bar"><i id="bar" style="width:100%"></i></div>
  <div class="row">
    <button class="btn" id="pause">Pause</button>
    <button class="btn primary" id="done">Done</button>
  </div>
  <div class="hint" id="pausehint">One pause allowed per attempt.</div>
</div>
<div class="end" id="endview" style="display:none">
  <div class="tick">&#10003;</div>
  <b>Logged as solved</b>
  <span>Closing&hellip;</span>
</div>
<div class="videos" id="videosview" style="display:none">
  <div class="vhead">
    <b>Time&#39;s up</b>
    <span id="vtitle"></span>
  </div>
  <div class="vlist" id="vlist"></div>
  <div class="vplayer" id="vplayer" style="display:none">
    <iframe id="vframe" frameborder="0" allowfullscreen
      allow="autoplay; encrypted-media"></iframe>
  </div>
</div>
<script>
var q = new URLSearchParams(location.search);
var id = parseInt(q.get('id'), 10);
var title = q.get('title') || '';
var totalMin = parseFloat(q.get('min'));
if(!isFinite(totalMin) || totalMin <= 0) totalMin = 25;
var totalSec = Math.round(totalMin * 60);

document.getElementById('pid').textContent = isFinite(id) ? ('#' + id) : '';
document.getElementById('ptitle').textContent = title;

// pywebview is a first-party native window -- AudioContext starts running
// immediately, no user gesture required. No unlock dance needed.
var audioCtx = null;
function ensureAudio(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }catch(e){}
}
ensureAudio();

function beep(n, gap){
  if(!audioCtx) return;
  var t = audioCtx.currentTime;
  for(var i = 0; i < n; i++){
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'square'; o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.35, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + 0.3);
    t += (gap || 0.4);
  }
}
function alarm(){
  ensureAudio();
  beep(4, 0.35);
  setTimeout(function(){ beep(4, 0.35); }, 3000);
}

// Timestamp-driven, not tick-counted: a background tab throttles setInterval,
// so counting down "one second per tick" drifts. Recomputing from Date.now()
// against a fixed end time is exact regardless of how late a tick fires.
var running = true;
var paused = false;
var pauseUsed = false;
var endAt = Date.now() + totalSec * 1000;
var remainingMs = totalSec * 1000;   // valid only while paused
var pausedMs = 0;
var pauseStartedAt = null;
var finished = false;
var timerHandle = null;

var timeEl = document.getElementById('time');
var barEl = document.getElementById('bar');
var pauseBtn = document.getElementById('pause');
var doneBtn = document.getElementById('done');
var pausehint = document.getElementById('pausehint');

function fmt(ms){
  var s = Math.max(0, Math.round(ms / 1000));
  var m = Math.floor(s / 60), r = s % 60;
  return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
}

function paint(){
  var remaining = paused ? remainingMs : Math.max(0, endAt - Date.now());
  var frac = remaining / (totalSec * 1000);
  timeEl.textContent = fmt(remaining);
  timeEl.className = 'time' + (frac <= 0.1 ? ' danger' : frac <= 0.3 ? ' warn' : '');
  barEl.style.width = Math.max(0, frac * 100) + '%';
  barEl.className = frac <= 0.1 ? 'danger' : frac <= 0.3 ? 'warn' : '';
  document.title = (isFinite(id) ? ('#' + id + ' \u00b7 ') : '') + fmt(remaining);
  if(!paused && remaining <= 0 && running){
    running = false;
    timeout();
  }
}

function tick(){ paint(); }

function start(){
  timerHandle = setInterval(tick, 250);
  paint();
}

pauseBtn.addEventListener('click', function(){
  if(finished) return;
  if(!paused){
    if(pauseUsed) return;   // guarded by disabled state too
    paused = true;
    remainingMs = Math.max(0, endAt - Date.now());
    pauseStartedAt = Date.now();
    pauseBtn.textContent = 'Resume';
  }else{
    paused = false;
    pausedMs += Date.now() - pauseStartedAt;
    endAt = Date.now() + remainingMs;
    pauseUsed = true;
    pauseBtn.textContent = 'Pause used';
    pauseBtn.disabled = true;
    pausehint.textContent = 'Pause already used for this attempt.';
  }
  paint();
});

function elapsedSecondsNow(){
  var remaining = paused ? remainingMs : Math.max(0, endAt - Date.now());
  return Math.max(0, totalSec - Math.round(remaining / 1000));
}

doneBtn.addEventListener('click', function(){
  if(finished) return;
  finished = true;
  clearInterval(timerHandle);
  var elapsed = elapsedSecondsNow(), paused = Math.round(pausedMs / 1000);
  // Tell Python: log as solved, close this window.
  window.pywebview.api.timer_done({id: id, elapsed_sec: elapsed, paused_sec: paused})
    .catch(function(){});
  document.getElementById('live').style.display = 'none';
  document.getElementById('endview').style.display = 'flex';
  setTimeout(function(){ window.pywebview.api.close_timer && window.pywebview.api.close_timer(); }, 500);
});

function timeout(){
  if(finished) return;
  finished = true;
  clearInterval(timerHandle);
  alarm();
  var elapsed = elapsedSecondsNow(), paused = Math.round(pausedMs / 1000);
  // Tell Python: pre-fill the stuck panel in the main window, get video results.
  document.getElementById('live').style.display = 'none';
  document.getElementById('videosview').style.display = 'flex';
  document.getElementById('vtitle').textContent = title;
  window.pywebview.api.timer_timeout({id: id, elapsed_sec: elapsed, paused_sec: paused})
    .then(function(r){
      renderVideos(r && r.results ? r.results : []);
    })
    .catch(function(){ renderVideos([]); });
}

function renderVideos(results){
  var list = document.getElementById('vlist');
  if(!results.length){
    list.innerHTML = '<div style="padding:20px;color:var(--muted);font-size:13px">No results found.</div>';
    return;
  }
  list.innerHTML = results.map(function(r){
    return '<div class="vitem" data-vid="'+esc(r.id)+'">'
      +'<img class="vthumb" src="'+esc(r.thumbnail)+'" loading="lazy">'
      +'<div class="vmeta"><div class="vtitle">'+esc(r.title)+'</div>'
      +'<div class="vchan">'+esc(r.channel)+(r.duration?' \u00b7 '+esc(r.duration):'')+'</div>'
      +'</div></div>';
  }).join('');
  list.addEventListener('click', function(e){
    var item = e.target.closest('[data-vid]');
    if(!item) return;
    var vid = item.dataset.vid;
    var player = document.getElementById('vplayer');
    var frame = document.getElementById('vframe');
    list.style.display = 'none';
    player.style.display = 'flex';
    frame.src = 'https://www.youtube.com/embed/'+vid+'?autoplay=1';
  });
}

function esc(s){
  return String(s||'').replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}

start();
</script>
</body>
</html>
