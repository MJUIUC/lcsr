[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lcsr"
version = "0.1.0"
description = "Run the 18-week DSA curriculum's daily loop"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
lcsr = "lcsr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lcsr = ["data/*.json", "static/*.html"]
